<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>松兰旅游 · SONGLAN TRAVEL</title>
<meta name="description" content="松兰旅游：国内国外行程海报，按地区、天数、价格筛选，点开查看详情与团期。">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
  :root{
    --bg:#FFFFFF; --surface:#F5F5F4; --ink:#32154C; --purple:#5B2A86;
    --lav:#B9A3D4; --lavbg:#EDE7F3; --gold:#C2A878; --muted:#666666;
    --line:#E8E8E8; --dark:#1D0B2E;
    --ease:cubic-bezier(.22,1,.36,1); /* v3 動效签名：快起缓落 */
    --ease-spring:cubic-bezier(.34,1.56,.64,1); /* v4：轻微回弹 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
  img{display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  main{padding:0 16px 24px;max-width:1080px;margin:0 auto}

  /* ===== 顶栏：磨砂 56px ===== */
  .topbar{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
  .brand img{width:30px;height:30px;border-radius:50%}
  .brand b{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:19px;letter-spacing:.14em;font-weight:700}
  .brand small{display:block;font-family:inherit;font-size:8px;letter-spacing:.34em;color:var(--muted);font-weight:400}
  .top-actions{display:flex;align-items:center;gap:4px}
  .icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);transition:background .25s var(--ease),transform .2s var(--ease)}
  .icon-btn:active{transform:scale(.92);background:var(--lavbg)}
  .icon-btn svg{width:21px;height:21px}

  /* ===== 滚动进度金线 ===== */
  .progress{position:fixed;top:56px;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;z-index:51;pointer-events:none}

  /* ===== 搜索条（可收起） ===== */
  .searchbar{max-height:0;overflow:hidden;transition:max-height .35s var(--ease);background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent}
  .searchbar.open{max-height:60px;border-bottom-color:var(--line)}
  .search-inner{display:flex;align-items:center;gap:10px;margin:10px 16px;padding:0 14px;height:40px;background:var(--surface);border-radius:999px}
  .search-inner svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto}
  .search-inner input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--ink);min-width:0}
  .search-inner input::placeholder{color:#9a9a9a}
  .search-clear{width:24px;height:24px;border-radius:50%;background:#ddd;color:#555;font-size:15px;line-height:1;flex:0 0 auto}

  /* ===== 全屏菜单 ===== */
  .menu{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:20px 24px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
  .menu.open{opacity:1;pointer-events:auto}
  .menu-top{display:flex;align-items:center;justify-content:space-between}
  .menu-top img{width:34px;height:34px;border-radius:50%}
  .menu-x{width:40px;height:40px;font-size:26px;color:var(--ink)}
  .menu-links{margin-top:48px;display:flex;flex-direction:column;gap:6px}
  .menu-links a{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:32px;line-height:1.5;color:var(--ink);text-decoration:none;letter-spacing:.06em;padding:8px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
  .menu.open .menu-links a{opacity:1;transform:none}
  .menu.open .menu-links a:nth-child(1){transition-delay:.08s}
  .menu.open .menu-links a:nth-child(2){transition-delay:.14s}
  .menu.open .menu-links a:nth-child(3){transition-delay:.2s}
  .menu.open .menu-links a:nth-child(4){transition-delay:.26s}
  .menu-links a span{font-size:12px;color:var(--muted);letter-spacing:.2em;margin-left:10px;font-family:"PingFang SC",sans-serif}

  /* ===== Hero 横幅：开场满屏，0.55s 后 1.15s 收起到 1/4 屏（纯 CSS，JS 失败也不卡住） ===== */
  .hero{position:relative;height:25vh;min-height:168px;max-height:300px;margin:0 -16px;overflow:hidden;background:var(--dark);animation:heroIntro 1.15s var(--ease) .55s both}
  @keyframes heroIntro{from{height:calc(100vh - 56px);height:calc(100svh - 56px);max-height:calc(100vh - 56px);max-height:calc(100svh - 56px)}to{height:25vh}}
  .hero-media{width:100%;height:100%;animation:heroZoom 1.7s var(--ease) both}
  @keyframes heroZoom{from{transform:scale(1.12)}to{transform:scale(1)}}
  .hero img{width:100%;height:100%;object-fit:cover;animation:kenburns 32s ease-in-out infinite alternate;will-change:transform}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.06)}}
  .hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,35,.12) 0%,rgba(20,8,35,.02) 40%,rgba(20,8,35,.55) 78%,rgba(20,8,35,.72) 100%)}
  .hero-loc{position:absolute;top:12px;right:14px;display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.45);animation:fadein .8s var(--ease) .7s both}
  .hero-loc i{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
  .hero-copy{position:absolute;left:16px;right:16px;bottom:16px;color:#fff;will-change:transform,opacity}
  .hero-eyebrow{font-size:10px;letter-spacing:.42em;color:rgba(255,255,255,.85);margin-bottom:7px;animation:fadein .8s var(--ease) .1s both}
  .hero h1{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:clamp(32px,9vw,48px);line-height:1.15;font-weight:700;letter-spacing:.1em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
  .hero-rule{width:34px;height:2px;background:var(--gold);margin:11px 0 0;animation:fadein .8s var(--ease) .45s both}
  .hero h1 .mask{display:block;overflow:hidden}
  .hero h1 .line{display:block;transform:translateY(112%);animation:rise .9s var(--ease) .2s forwards}
  @keyframes rise{to{transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .hero-sub{margin-top:7px;font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:14px;letter-spacing:.14em;color:rgba(255,255,255,.88);animation:fadein .8s var(--ease) .55s both}

  /* ===== 筛选条（吸顶） ===== */
  .filterbar{position:sticky;top:56px;z-index:40;margin:0 -16px;padding:12px 16px 10px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .seg{position:relative;display:flex;width:228px;background:var(--surface);border-radius:999px;padding:3px}
  .seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:#fff;border-radius:999px;box-shadow:0 1px 5px rgba(50,21,76,.14);transition:transform .38s var(--ease-spring)}
  .seg button{position:relative;z-index:1;flex:1;padding:7px 0;font-size:14px;font-weight:600;color:var(--muted);transition:color .25s}
  .seg button.on{color:var(--ink)}
  .frow{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .frow::-webkit-scrollbar{display:none}
  .fbtn{flex:0 0 auto;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;color:var(--ink);transition:border-color .25s,background .25s,transform .15s var(--ease);white-space:nowrap}
  .fbtn:active{transform:scale(.96)}
  .fbtn.on{background:var(--lavbg);border-color:var(--lav);color:var(--purple);font-weight:600}
  .fbtn.clear{border-color:transparent;color:var(--gold);font-weight:600}

  /* ===== 结果行 + 已选条件 ===== */
  .results{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 2px 2px;font-size:12px;color:var(--muted)}
  .results b{color:var(--ink);font-size:14px}
  .results .sec-title{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:16px;color:var(--ink);letter-spacing:.06em}
  .apill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px 0 11px;border-radius:999px;background:var(--lavbg);color:var(--purple);font-size:12px;font-weight:600}
  .apill button{font-size:14px;line-height:1;color:var(--purple)}

  /* ===== 缩略图画廊：2 列，一屏 4 张 ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(50,21,76,.05);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
  .card.feat{border-color:rgba(194,168,120,.6)}
  .card:active{transform:scale(.98)}
  .card:active .thumb img{transform:scale(1.03)}
  .thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(100deg,#efedea 40%,#faf9f7 50%,#efedea 60%);background-size:200% 100%;animation:shimmer 1.8s linear infinite}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .5s var(--ease)}
  .thumb-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--purple);background:linear-gradient(160deg,#f2f1ee,#e4e2dd)}
  .thumb-ph .ph-char{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:30px;letter-spacing:.1em}
  .thumb-ph .ph-tag{font-size:10px;letter-spacing:.3em;border:1px solid rgba(91,42,134,.45);border-radius:999px;padding:2px 10px}
  .card-body{padding:8px 10px 10px}
  .region{font-size:11px;color:var(--purple);letter-spacing:.08em}
  .region .feat{color:var(--gold);font-weight:700}
  .title{font-size:14px;font-weight:600;line-height:1.4;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .price{font-size:14px;font-weight:700;color:var(--purple);margin-top:3px}

  /* 入场：淡入 + 轻抬，错峰 45ms */
  .reveal{opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
  .reveal.in{opacity:1;transform:none}

  /* ===== 空态 ===== */
  .empty{padding:56px 16px;text-align:center;color:var(--muted)}
  .empty .e-title{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:20px;color:var(--ink);margin-bottom:8px}
  .empty p{font-size:14px;line-height:1.7}
  .empty button{margin-top:18px;height:40px;padding:0 22px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}

  /* ===== 详情页 ===== */
  .detail{padding-top:16px;animation:detailIn .38s var(--ease) both}
  @keyframes detailIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .back{font-size:14px;color:var(--purple);margin-bottom:12px}
  .poster-full{border-radius:10px;overflow:hidden;background:var(--surface);cursor:zoom-in}
  .poster-full img{width:100%;height:auto}
  .tap-hint{text-align:center;font-size:11px;color:var(--muted);margin:8px 0 16px;letter-spacing:.1em}
  .detail h2{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:24px;margin:6px 0 8px;line-height:1.3}
  .detail .meta{font-size:13px}
  .info{margin:16px 0;border-top:1px solid var(--line)}
  .info-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .info-row .k{color:var(--muted);flex:0 0 auto}
  .info-row .v{text-align:right;font-weight:600}
  .desc{font-size:15px;line-height:1.85;color:#333;margin:4px 0 20px}
  .consult{width:100%;height:48px;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;transition:transform .15s var(--ease)}
  .consult:active{transform:scale(.98)}

  /* ===== 联系方式 ===== */
  .contact-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line)}
  .contact-k{font-size:12px;color:var(--muted);letter-spacing:.15em}
  .contact-v{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:.04em}
  .contact-btn{flex:0 0 auto;height:40px;padding:0 18px;border-radius:999px;background:var(--lavbg);color:var(--purple);font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
  .contact-btn.call{background:var(--ink);color:#fff}
  .contact-tip{font-size:13px;color:var(--muted);line-height:1.7;margin-top:16px}
  .contact-name{font-size:16px;font-weight:700;color:var(--ink)}
  .mini-copy{height:24px;padding:0 10px;border-radius:999px;background:var(--lavbg);color:var(--purple);font-size:12px;font-weight:600;margin-left:6px;vertical-align:2px}
  footer .tel{color:var(--purple);font-weight:700;text-decoration:none}

  /* ===== 详细行程 PDF ===== */
  .pdf-sec{margin:4px 0 20px;border-top:1px solid var(--line);padding-top:16px}
  .pdf-title{font-size:12px;letter-spacing:.2em;color:var(--muted);margin-bottom:10px}
  .pdf-link{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);margin-bottom:8px;transition:border-color .2s,background .2s}
  .pdf-link:active{background:var(--lavbg)}
  .pdf-badge{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--purple);border-radius:6px;padding:4px 7px}
  .pdf-label{flex:1;font-size:14px;font-weight:600}
  .pdf-go{flex:0 0 auto;font-size:12px;color:var(--muted)}

  /* ===== 页脚 ===== */
  footer{max-width:1080px;margin:0 auto;padding:32px 16px 48px;border-top:1px solid var(--line);text-align:center}
  footer h3{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:18px;letter-spacing:.1em;margin-bottom:8px}
  footer p{font-size:13px;color:var(--muted);line-height:1.8}
  footer .copy{margin-top:20px;font-size:11px;color:#aaa;letter-spacing:.08em}
  .foot-logo{width:40px;height:40px;border-radius:50%;margin:0 auto 10px}
  .credit{margin-top:14px;font-size:11px;color:#bbb;letter-spacing:.04em}

  /* ===== 底部弹出筛选层 ===== */
  .sheet-backdrop{position:fixed;inset:0;z-index:70;background:rgba(20,8,35,.38);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:72vh;display:flex;flex-direction:column;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .45s var(--ease);box-shadow:0 -8px 32px rgba(50,21,76,.16)}
  .sheet.open{transform:none}
  .sheet-handle{width:36px;height:4px;border-radius:999px;background:#ddd;margin:10px auto 4px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sheet-head h3{font-size:17px;font-weight:700}
  .sheet-x{width:32px;height:32px;font-size:22px;color:var(--muted)}
  .sheet-body{overflow-y:auto;padding:14px 18px 28px}
  .sheet-sec{font-size:12px;letter-spacing:.2em;color:var(--muted);margin:14px 0 10px}
  .sheet-sec:first-child{margin-top:2px}
  .opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .opt{padding:9px 2px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;transition:border-color .2s,background .2s}
  .opt b{display:block;font-size:14px;font-weight:600}
  .opt span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
  .opt.sel{border-color:var(--lav);background:var(--lavbg)}
  .opt.sel b{color:var(--purple)}
  .opt.zero span{color:#bbb}
  .opt-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
  .opt-row .chk{color:var(--purple);font-weight:700;opacity:0}
  .opt-row.sel{color:var(--purple);font-weight:600}
  .opt-row.sel .chk{opacity:1}
  .sheet.open .opt-row,.sheet.open .opt{animation:optIn .3s var(--ease) both}
  @keyframes optIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ===== 灯箱 ===== */
  .lightbox{position:fixed;inset:0;z-index:80;background:var(--dark);display:flex;align-items:center;justify-content:center}
  .lightbox[hidden]{display:none}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;animation:lbIn .3s var(--ease) both}
  @keyframes lbIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px;z-index:1}

  /* ===== 回到顶部 ===== */
  .totop{position:fixed;right:16px;bottom:20px;z-index:45;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 6px 18px rgba(50,21,76,.16);color:var(--purple);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(8px) scale(.9);transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .totop.show{opacity:1;pointer-events:auto;transform:none}
  .totop:active{transform:scale(.92)}

  @media (min-width:720px){
    .grid{grid-template-columns:repeat(3,1fr);gap:16px}
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(50,21,76,.10)}
    .card:hover .thumb img{transform:scale(1.05)}
    .hero{max-height:320px}
    .sheet{max-width:560px;left:50%;right:auto;transform:translate(-50%,105%);border-radius:18px 18px 0 0}
    .sheet.open{transform:translate(-50%,0)}
    .opt-grid{grid-template-columns:repeat(6,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    .hero img{animation:none}
    .hero h1 .line{animation:none;transform:none}
    .hero-eyebrow,.hero-sub,.hero-rule,.hero-loc{animation:none}
    .reveal{transition:none;opacity:1;transform:none}
    .thumb{animation:none}
    .hero,.hero-media{animation:none}
    .detail,.lightbox img{animation:none}
    .menu-links a{transition:none;opacity:1;transform:none}
    .sheet.open .opt-row,.sheet.open .opt{animation:none}
    .totop{transition:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

/* 列表 */
function thumbHTML(p){
  if (p.img) return '<div class="thumb"><img src="' + p.img + '" alt="' + p.title + '海报" loading="lazy"></div>';
  return '<div class="thumb"><div class="thumb-ph"><span class="ph-char">' + p.label + '</span><span class="ph-tag">示例海报</span></div></div>';
}
function renderList(){
  const items = applyFilters();
  grid.innerHTML = items.map((p, i) =>
    '<article class="card reveal' + (p.featured ? ' feat' : '') + '" data-id="' + p.id + '" style="transition-delay:' + ((i % 6) * 45) + 'ms">' + thumbHTML(p) +
    '<div class="card-body"><div class="region">' + p.label + (p.featured ? ' · <span class="feat">主推</span>' : '') + '</div>' +
    '<div class="title">' + p.title + '</div><div class="meta">' + metaLine(p) + '</div>' +
    '<div class="price">' + p.priceLabel + '</div></div></article>'
  ).join("");
  document.querySelectorAll("[data-id]").forEach(el => el.addEventListener("click", () => { location.hash = "#/p/" + el.dataset.id; }));
  emptyBox.hidden = items.length > 0;
  if (!items.length){
    const noRegion = state.region && countFor(state.region) === 0;
    emptyBox.innerHTML = '<div class="e-title">' + (noRegion ? state.region + " · 即将上线" : "没有符合条件的行程") + '</div>' +
      '<p>' + (noRegion ? "该地区的海报正在准备中，先看看其他地方吧。" : "试试调整筛选条件，或换个关键词搜搜。") + '</p>' +
      '<button id="emptyAll">查看全部行程</button>';
    $("#emptyAll").addEventListener("click", clearFilters);
  }
  renderResults(items.length);
  observeReveals();
}
function renderResults(n){
  let h = '<span class="sec-title">精选行程</span><span>共 <b>' + n + '</b> 条行程</span>';
  const pills = [];
  if (state.scope !== "全部") pills.push({k:"scope", t:state.scope});
  if (state.region) pills.push({k:"region", t:state.region});
  if (state.days) pills.push({k:"days", t:DAYS_OPTS.find(o => o.k === state.days).l});
  if (state.price) pills.push({k:"price", t:PRICE_OPTS.find(o => o.k === state.price).l});
  if (state.q.trim()) pills.push({k:"q", t:"“" + state.q.trim() + "”"});
  h += pills.map(p => '<span class="apill">' + p.t + '<button data-clear="' + p.k + '" aria-label="清除">×</button></span>').join("");
  resultsBox.innerHTML = h;
  resultsBox.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.clear;
    if (k === "scope") state.scope = "全部";
    if (k === "region") state.region = null;
    if (k === "days") state.days = null;
    if (k === "price") state.price = null;
    if (k === "q"){ state.q = ""; $("#searchInput").value = ""; $("#searchClear").hidden = true; }
    syncFilterUI(); renderList();
  }));
}

/* 筛选 UI 同步 */
function syncFilterUI(){
  const idx = ["全部","国内","国外"].indexOf(state.scope);
  $("#segInd").style.transform = "translateX(" + (idx * 100) + "%)";
  document.querySelectorAll("#scopeSeg button").forEach(b => b.classList.toggle("on", b.dataset.scope === state.scope));
  const rb = $("#regionBtn"), db = $("#daysBtn"), pb = $("#priceBtn");
  rb.textContent = (state.region || "地区") + " ▾"; rb.classList.toggle("on", !!state.region);
  db.textContent = (state.days ? DAYS_OPTS.find(o => o.k === state.days).l : "天数") + " ▾"; db.classList.toggle("on", !!state.days);
  pb.textContent = (state.price ? PRICE_OPTS.find(o => o.k === state.price).l : "价格") + " ▾"; pb.classList.toggle("on", !!state.price);
  $("#clearBtn").hidden = !hasFilter();
}
document.querySelectorAll("#scopeSeg button").forEach(b => b.addEventListener("click", () => {
  state.scope = b.dataset.scope;
  if (state.region){
    const list = state.scope === "国内" ? PROVINCES : state.scope === "国外" ? COUNTRIES : PROVINCES.concat(COUNTRIES);
    if (list.indexOf(state.region) === -1) state.region = null;
  }
  syncFilterUI(); renderList();
}));
$("#clearBtn").addEventListener("click", clearFilters);

/* 底部弹出层 */
const sheet = $("#sheet"), sheetBackdrop = $("#sheetBackdrop");
function openSheet(){ sheet.classList.add("open"); sheetBackdrop.classList.add("open"); document.body.style.overflow = "hidden"; }
function closeSheet(){ sheet.classList.remove("open"); sheetBackdrop.classList.remove("open"); document.body.style.overflow = ""; }
$("#sheetClose").addEventListener("click", closeSheet);
sheetBackdrop.addEventListener("click", closeSheet);
function regionSection(title, list){
  return '<div class="sheet-sec">' + title + '</div><div class="opt-grid">' + list.map(r => {
    const n = countFor(r);
    return '<button class="opt' + (state.region === r ? ' sel' : '') + (n === 0 ? ' zero' : '') + '" data-region="' + r + '"><b>' + r + '</b><span>' + (n ? n + " 条行程" : "即将上线") + '</span></button>';
  }).join("") + "</div>";
}
$("#regionBtn").addEventListener("click", () => {
  $("#sheetTitle").textContent = "选择地区";
  let h = '<button class="opt-row' + (!state.region ? ' sel' : '') + '" data-region="">全部地区<span class="chk">✓</span></button>';
  if (state.scope === "全部") h += regionSection("国内 · 省份", PROVINCES) + regionSection("国外 · 国家", COUNTRIES);
  else if (state.scope === "国内") h += regionSection("国内 · 省份", PROVINCES);
  else h += regionSection("国外 · 国家", COUNTRIES);
  $("#sheetBody").innerHTML = h;
  $("#sheetBody").querySelectorAll("[data-region]").forEach(b => b.addEventListener("click", () => {
    state.region = b.dataset.region || null;
    closeSheet(); syncFilterUI(); renderList();
  }));
  openSheet();
});
function openOptionSheet(title, opts, key){
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = opts.map(o =>
    '<button class="opt-row' + (state[key] === o.k ? ' sel' : '') + '" data-k="' + (o.k === null ? "" : o.k) + '">' + o.l + '<span class="chk">✓</span></button>'
  ).join("");
  $("#sheetBody").querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
    state[key] = b.dataset.k || null;
    closeSheet(); syncFilterUI(); renderList();
  }));
  openSheet();
}
$("#daysBtn").addEventListener("click", () => openOptionSheet("选择天数", DAYS_OPTS, "days"));
$("#priceBtn").addEventListener("click", () => openOptionSheet("选择价格", PRICE_OPTS, "price"));

/* 联系杨女士：复制微信 / 拨打电话 */
function copyText(t, btn){
  const done = () => { const o = btn.textContent; btn.textContent = "已复制 ✓"; setTimeout(() => { btn.textContent = o; }, 2000); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){}
  document.body.removeChild(ta);
}
function openContactSheet(){
  $("#sheetTitle").textContent = "联系杨女士";
  $("#sheetBody").innerHTML =
    '<div class="contact-row"><div><div class="contact-k">微信</div><div class="contact-v">z13320488173</div></div>' +
    '<button class="contact-btn" id="copyWx">复制微信号</button></div>' +
    '<div class="contact-row"><div><div class="contact-k">电话</div><div class="contact-v">13320488173</div></div>' +
    '<a class="contact-btn call" href="tel:13320488173">拨打电话</a></div>' +
    '<p class="contact-tip">加微信请备注想去的地方，方便杨女士直接发你团期和余位。</p>';
  $("#copyWx").addEventListener("click", e => copyText("z13320488173", e.target));
  openSheet();
}

/* 搜索 */
const searchbar = $("#searchbar"), searchInput = $("#searchInput");
$("#searchToggle").addEventListener("click", () => {
  const open = searchbar.classList.toggle("open");
  if (open) searchInput.focus();
});
searchInput.addEventListener("input", () => {
  state.q = searchInput.value;
  $("#searchClear").hidden = !searchInput.value;
  renderList();
});
$("#searchClear").addEventListener("click", () => {
  searchInput.value = ""; state.q = ""; $("#searchClear").hidden = true; renderList(); searchInput.focus();
});
searchInput.addEventListener("keydown", e => { if (e.key === "Enter") searchInput.blur(); });

/* 菜单 */
const menu = $("#menu");
function openMenu(){ menu.classList.add("open"); document.body.style.overflow = "hidden"; }
function closeMenu(){ menu.classList.remove("open"); document.body.style.overflow = ""; }
$("#menuBtn").addEventListener("click", openMenu);
$("#menuClose").addEventListener("click", closeMenu);
document.querySelectorAll(".menu-links a[data-scope]").forEach(a => a.addEventListener("click", () => {
  state.scope = a.dataset.scope; state.region = null;
  closeMenu(); syncFilterUI(); renderList();
}));
$("#menuContact").addEventListener("click", () => {
  closeMenu();
  setTimeout(() => document.getElementById("contact").scrollIntoView({behavior:"smooth"}), 60);
});

/* 详情页 */
function renderDetail(id){
  const p = POSTERS.find(x => x.id === id);
  if (!p){ location.hash = "#/"; return; }
  const pdfHTML = p.pdfs ? '<div class="pdf-sec"><div class="pdf-title">详细行程</div>' + p.pdfs.map(f =>
    '<a class="pdf-link" href="' + f.file + '" target="_blank" rel="noopener"><span class="pdf-badge">PDF</span><span class="pdf-label">' + f.label + '</span><span class="pdf-go">点击查看 ›</span></a>'
  ).join("") + '</div>' : '';
  detailView.innerHTML =
    '<div class="detail"><button class="back" id="backBtn">← 全部海报</button>' +
    '<div class="poster-full" id="detailPoster">' + (p.img ? '<img src="' + p.img + '" alt="' + p.title + '海报">' : "") + '</div>' +
    '<p class="tap-hint">点按海报可放大查看</p>' +
    '<div class="region">' + p.label + '</div><h2>' + p.title + '</h2>' +
    '<div class="meta">' + metaLine(p) + '</div>' +
    '<div class="info">' +
    '<div class="info-row"><span class="k">行程天数</span><span class="v">' + p.daysLabel + '</span></div>' +
    '<div class="info-row"><span class="k">出发地</span><span class="v">' + p.from + '</span></div>' +
    '<div class="info-row"><span class="k">价格</span><span class="v">' + p.priceLabel + '</span></div>' +
    '<div class="info-row"><span class="k">团期</span><span class="v">' + p.dates + '</span></div>' +
    '</div><p class="desc">' + p.desc + '</p>' + pdfHTML +
    '<button class="consult" id="consultBtn">咨询行程</button></div>';
  $("#backBtn").addEventListener("click", () => { location.hash = "#/"; });
  $("#detailPoster").addEventListener("click", () => openLightbox(p));
  $("#consultBtn").addEventListener("click", openContactSheet);
}

/* 路由 */
function route(){
  const m = location.hash.match(/^#\/p\/([\w-]+)$/);
  if (m){ listView.hidden = true; detailView.hidden = false; renderDetail(m[1]); }
  else { listView.hidden = false; detailView.hidden = true; renderList(); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* 灯箱 */
const lightbox = $("#lightbox");
function openLightbox(p){
  $("#lbBody").innerHTML = p.img ? '<img src="' + p.img + '" alt="' + p.title + '海报原图">' : "";
  lightbox.hidden = false; document.body.style.overflow = "hidden";
}
function closeLightbox(){ lightbox.hidden = true; document.body.style.overflow = ""; }
$("#lbClose").addEventListener("click", closeLightbox);
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeLightbox(); closeMenu(); closeSheet(); } });

/* 入场淡入（错峰由 transition-delay 控制） */
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), {threshold:.12});
function observeReveals(){ document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el)); }

/* 滚动：进度金线 + Hero 视差 */
const progress = $("#progress"), heroCopy = $("#heroCopy"), hero = $("#hero");
let ticking = false;
window.addEventListener("scroll", () => { if (!ticking){ requestAnimationFrame(onScroll); ticking = true; } }, {passive:true});
function onScroll(){
  ticking = false;
  const y = window.scrollY || document.documentElement.scrollTop;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  progress.style.transform = "scaleX(" + (max > 0 ? y / max : 0) + ")";
  const tt = $("#toTop");
  if (tt) tt.classList.toggle("show", y > 420);
  if (hero && !listView.hidden){
    const h = hero.offsetHeight || 1;
    const p = Math.min(y / h, 1);
    heroCopy.style.transform = "translateY(" + (y * 0.28) + "px)";
    heroCopy.style.opacity = String(Math.max(1 - p * 1.15, 0));
  }
}

document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copyText(b.dataset.copy, b)));
$("#toTop").addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));

syncFilterUI();
route();

/* 开场动效期间锁滚动（1.8s 后释放；减动效或直达详情页时不锁） */
if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches && !location.hash.match(/^#\/p\//)){
  document.body.style.overflow = "hidden";
  setTimeout(() => { document.body.style.overflow = ""; }, 1800);
}
</script>
</body>
