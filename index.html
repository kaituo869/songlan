<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松兰旅游 · SONGLAN TRAVEL</title>
<meta name="description" content="松兰旅游：旅游宣传海报与地区行程。点开海报查看行程详情，放大看原图。">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<style>
  :root{
    --bg:#ffffff; --surface:#f5f5f4; --ink:#32154c; --purple:#5b2a86;
    --lav:#b9a3d4; --lavbg:#ede7f3; --gold:#c2a878;
    --muted:#666666; --line:#e8e8e8; --card:#fff; --dark:#1d0b2e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:#1a1a1a;line-height:1.8;}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--purple);outline-offset:2px}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px}
  /* 顶栏：56px，不占主画面 */
  .topbar{position:sticky;top:0;z-index:40;height:56px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand img{width:30px;height:30px;border-radius:6px;display:block}
  .brand-name{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:19px;letter-spacing:.22em;color:var(--ink);font-weight:700}
  .brand-en{font-size:9px;letter-spacing:.28em;color:var(--muted);margin-top:3px}
  .burger{width:44px;height:44px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
  .burger span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px}
  /* 全屏菜单 */
  .menu{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:20px 24px 40px;display:none;flex-direction:column}
  .menu.open{display:flex}
  .menu-close{align-self:flex-end;width:44px;height:44px;border:0;background:transparent;font-size:32px;line-height:1;color:var(--ink)}
  .menu-links{display:flex;flex-direction:column;gap:6px;margin-top:24px}
  .menu-links a{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:30px;letter-spacing:.14em;color:var(--ink);padding:10px 0;border-bottom:1px solid var(--line)}
  .menu-links a small{font-family:"PingFang SC",sans-serif;font-size:12px;letter-spacing:.2em;color:var(--muted);margin-left:10px}
  .menu-foot{margin-top:auto;padding-top:32px;font-size:12px;letter-spacing:.24em;color:var(--muted)}
  /* Hero：紧凑，标题字即设计 */
  .hero{padding:36px 0 20px;animation:heroIn .5s ease both}
  @keyframes heroIn{from{opacity:0}to{opacity:1}}
  .eyebrow{font-size:11px;letter-spacing:.42em;color:var(--purple);font-weight:600}
  .hero h1{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:clamp(40px,11vw,56px);letter-spacing:.12em;color:var(--ink);line-height:1.25;margin:10px 0 8px}
  .hero-sub{color:var(--muted);font-size:15px}
  .gold-rule{width:44px;height:2px;background:var(--gold);margin-top:16px}
  /* 地区筛选条：最显眼的操作入口，吸顶 */
  .filterbar{position:sticky;top:56px;z-index:30;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(50,21,76,.06)}
  .filter-scroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filter-scroll::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;min-height:44px;padding:0 18px;border:1px solid var(--purple);border-radius:999px;background:transparent;color:var(--purple);font-size:15px;font-weight:600;letter-spacing:.06em}
  .pill.active{background:var(--lavbg);border-color:var(--lav);color:var(--ink)}
  /* 主推海报：全幅一张图 */
  .featured{margin:20px 0 8px}
  .poster{position:relative;border-radius:10px;overflow:hidden;background:#f0efec}
  .poster.ratio34{aspect-ratio:3/4}
  .poster img{width:100%;height:100%;object-fit:cover;display:block}
  .poster-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--purple)}
  .poster-ph .ph-char{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:52px;letter-spacing:.1em}
  .poster-ph .ph-tag{font-size:11px;letter-spacing:.3em;opacity:.85;border:1px solid rgba(91,42,134,.45);border-radius:999px;padding:2px 12px}
  .feat-title{padding:12px 2px 4px}
  .region{font-size:12px;letter-spacing:.24em;color:var(--purple);font-weight:600}
  .title{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:21px;color:var(--ink);letter-spacing:.06em;line-height:1.4}
  .meta{font-size:13px;color:var(--muted);margin-top:2px}
  /* 画廊：手机 2 列 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .2s ease}
  .card:active{transform:scale(.98)}
  .card .poster{border-radius:0}
  .card-body{padding:10px 12px 12px}
  .card-body .title{font-size:16px}
  .card-body .meta{font-size:12px}
  .card .poster-ph .ph-char{font-size:34px}
  /* 入场：只淡入，不上滑 */
  .reveal{opacity:0;transition:opacity .35s ease}
  .reveal.in{opacity:1}
  /* 空态 */
  .empty{padding:64px 0;text-align:center;color:var(--muted)}
  .empty p{margin-bottom:16px}
  .btn{display:inline-block;min-height:48px;line-height:48px;padding:0 28px;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;border:0;letter-spacing:.08em}
  .btn.ghost{background:transparent;color:var(--purple);border:1px solid var(--purple)}
  /* 详情页 */
  .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:0;background:transparent;color:var(--purple);font-size:15px;padding:12px 0}
  .detail .poster{cursor:zoom-in}
  .detail h2{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:28px;color:var(--ink);letter-spacing:.06em;line-height:1.35;margin:14px 0 4px}
  .info{margin:18px 0;border-top:1px solid var(--line)}
  .info-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .info-row .k{color:var(--muted)}
  .info-row .v{color:#1a1a1a;text-align:right}
  .desc{font-size:15px;color:#444444;margin:16px 0 24px}
  .consult{display:block;width:100%;min-height:52px;line-height:52px;text-align:center;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;letter-spacing:.1em;margin-bottom:8px}
  .tap-hint{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 32px}
  /* 灯箱 */
  .lightbox{position:fixed;inset:0;z-index:80;background:var(--dark);display:flex;flex-direction:column}
  .lightbox[hidden]{display:none}
  .lb-close{align-self:flex-end;width:48px;height:48px;border:0;background:transparent;color:#fff;font-size:34px;line-height:1;margin:8px 8px 0}
  .lb-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 12px 24px;min-height:0}
  .lb-body img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px}
  .lb-body .poster{width:min(92vw,420px)}
  .lb-hint{color:#b9a8d4;font-size:12px;letter-spacing:.14em}
  /* 页脚 */
  footer{border-top:1px solid var(--line);margin-top:48px;padding:36px 0 56px;text-align:center}
  footer img{width:54px;height:54px;border-radius:10px}
  footer .f-name{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:19px;letter-spacing:.3em;color:var(--ink);margin:10px 0 2px}
  footer .f-en{font-size:10px;letter-spacing:.34em;color:var(--muted)}
  footer .f-contact{margin-top:16px;font-size:13px;color:var(--muted)}
  footer .f-copy{margin-top:8px;font-size:12px;color:var(--muted)}
  @media (min-width:720px){
    .wrap{max-width:1080px}
    .topbar{padding:0 24px}
    .hero h1{font-size:56px}
    .grid{grid-template-columns:repeat(3,1fr);gap:18px}
    .featured .poster{max-height:78vh}
    .featured .poster img{object-position:center 30%}
    .card:hover{transform:translateY(-2px)}
    .card:hover .poster img{transform:scale(1.02)}
    .card .poster img{transition:transform .3s ease}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .reveal{opacity:1}
  }
</style>
</head>

  <button class="lb-close" id="lbClose" aria-label="关闭放大查看">×</button>
  <div class="lb-body" id="lbBody"></div>

<noscript><p style="padding:32px 0;text-align:center;color:#7a6f68">请开启 JavaScript 后查看海报画廊。</p></noscript>
<script>
/* ============ 海报数据：加一张海报只需在这里加一行，图片放 posters/ 目录 ============ */
const POSTERS = [
  {id:"dali",    title:"大理苍山洱海",     region:"云南", days:"5天4晚", from:"昆明出发",     price:"待定", img:null, grad:"linear-gradient(160deg,#5b2a86,#9d7bca)", desc:"示例行程介绍：等王总提供这条行程的文案后替换。"},
  {id:"lijiang", title:"丽江古城慢游",     region:"云南", days:"4天3晚", from:"丽江出发",     price:"待定", img:null, grad:"linear-gradient(160deg,#4a2a6e,#8e6bb8)", desc:"示例行程介绍：等王总提供这条行程的文案后替换。"},
  {id:"lasa",    title:"拉萨布宫圣湖",     region:"西藏", days:"7天6晚", from:"拉萨出发",     price:"待定", img:null, grad:"linear-gradient(160deg,#2e3a6e,#6b7fb8)", desc:"示例行程介绍：等王总提供这条行程的文案后替换。"},
  {id:"sanya",   title:"三亚蜈支洲岛",     region:"海岛", days:"4天3晚", from:"三亚出发",     price:"待定", img:null, grad:"linear-gradient(160deg,#1f6e6e,#5cb8b0)", desc:"示例行程介绍：等王总提供这条行程的文案后替换。"},
  {id:"wuzhen",  title:"乌镇水乡夜色",     region:"古镇", days:"2天1晚", from:"上海出发",     price:"待定", img:null, grad:"linear-gradient(160deg,#4a5568,#8a9ab0)", desc:"示例行程介绍：等王总提供这条行程的文案后替换。"},
  {id:"meili",   title:"梅里雪山日照金山", region:"雪山", days:"5天4晚", from:"香格里拉出发", price:"待定", img:null, grad:"linear-gradient(160deg,#3a5a8a,#8fb0d8)", desc:"示例行程介绍：等王总提供这条行程的文案后替换。"},
  {id:"dunhuang",title:"敦煌鸣沙山月牙泉", region:"沙漠", days:"4天3晚", from:"敦煌出发",     price:"待定", img:null, grad:"linear-gradient(160deg,#8a6a3a,#c8a86a)", desc:"示例行程介绍：等王总提供这条行程的文案后替换。"}
];
const REGIONS = ["全部"].concat(POSTERS.map(p => p.region).filter((v, i, a) => a.indexOf(v) === i));
let currentRegion = "全部";

const $ = s => document.querySelector(s);
const listView = $("#view-list"), detailView = $("#view-detail");

/* 海报图：有原图用 img，没有则用渐变占位块（标注示例） */
function posterHTML(p, cls){
  if (p.img) return '<div class="poster ' + cls + '"><img src="' + p.img + '" alt="' + p.title + '海报" loading="lazy"></div>';
  return '<div class="poster ' + cls + '"><div class="poster-ph" style="background:linear-gradient(160deg,#f2f1ee,#e4e2dd)">'
    + '<span class="ph-char">' + p.region + '</span><span class="ph-tag">示例海报</span></div></div>';
}
function metaLine(p){ return p.days + " · " + p.from; }

/* 筛选条 */
function renderFilters(){
  $("#filterScroll").innerHTML = REGIONS.map(r =>
    '<button class="pill' + (r === currentRegion ? ' active' : '') + '" data-region="' + r + '">' + r + '</button>'
  ).join("");
  document.querySelectorAll("#filterScroll .pill").forEach(b => b.addEventListener("click", () => {
    currentRegion = b.dataset.region;
    renderFilters(); renderList();
    $("#featured").scrollIntoView({behavior:"smooth", block:"start"});
  }));
}

/* 列表：第一张全幅主推，其余进 2 列画廊 */
function renderList(){
  const items = POSTERS.filter(p => currentRegion === "全部" || p.region === currentRegion);
  $("#empty").hidden = items.length > 0;
  if (!items.length){ $("#featured").innerHTML = ""; $("#grid").innerHTML = ""; return; }
  const f = items[0];
  $("#featured").innerHTML =
    '<div class="reveal" data-id="' + f.id + '" style="cursor:pointer">' + posterHTML(f, "ratio34") +
    '<div class="feat-title"><div class="region">' + f.region + ' · <span style="color:var(--gold)">主推</span></div>' +
    '<div class="title">' + f.title + '</div><div class="meta">' + metaLine(f) + '</div></div></div>';
  $("#grid").innerHTML = items.slice(1).map(p =>
    '<article class="card reveal" data-id="' + p.id + '">' + posterHTML(p, "ratio34") +
    '<div class="card-body"><div class="region">' + p.region + '</div>' +
    '<div class="title">' + p.title + '</div><div class="meta">' + metaLine(p) + '</div></div></article>'
  ).join("");
  document.querySelectorAll("[data-id]").forEach(el => el.addEventListener("click", () => {
    location.hash = "#/p/" + el.dataset.id;
  }));
  observeReveals();
}

/* 详情页 */
function renderDetail(id){
  const p = POSTERS.find(x => x.id === id);
  if (!p){ location.hash = "#/"; return; }
  detailView.innerHTML =
    '<div class="detail"><button class="back" id="backBtn">← 全部海报</button>' +
    '<div id="detailPoster">' + posterHTML(p, "ratio34") + '</div>' +
    '<p class="tap-hint">点按海报可放大查看</p>' +
    '<div class="region">' + p.region + '</div><h2>' + p.title + '</h2>' +
    '<div class="meta">' + metaLine(p) + '</div>' +
    '<div class="info">' +
    '<div class="info-row"><span class="k">行程天数</span><span class="v">' + p.days + '</span></div>' +
    '<div class="info-row"><span class="k">出发地</span><span class="v">' + p.from + '</span></div>' +
    '<div class="info-row"><span class="k">价格</span><span class="v">' + p.price + '</span></div>' +
    '</div><p class="desc">' + p.desc + '</p>' +
    '<button class="consult" id="consultBtn">咨询行程</button></div>';
  $("#backBtn").addEventListener("click", () => { location.hash = "#/"; });
  $("#detailPoster").addEventListener("click", () => openLightbox(p));
  $("#consultBtn").addEventListener("click", () => {
    document.getElementById("contact").scrollIntoView({behavior:"smooth"});
  });
}

/* 路由：#/ 列表，#/p/xxx 详情（浏览器后退可用） */
function route(){
  const m = location.hash.match(/^#\/p\/([\w-]+)/);
  if (m){
    listView.hidden = true; detailView.hidden = false;
    renderDetail(m[1]); window.scrollTo(0, 0);
  } else {
    detailView.hidden = true; listView.hidden = false;
    renderList();
  }
}

/* 全屏菜单 */
const menu = $("#menu");
function openMenu(){
  menu.classList.add("open"); menu.setAttribute("aria-hidden", "false");
  $("#burger").setAttribute("aria-expanded", "true");
  document.body.style.overflow = "hidden";
}
function closeMenu(){
  menu.classList.remove("open"); menu.setAttribute("aria-hidden", "true");
  $("#burger").setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";
}
$("#menuLinks").innerHTML = REGIONS.map(r =>
  '<a href="#/" data-region="' + r + '">' + (r === "全部" ? "全部海报" : r) + '<small>' +
  (r === "全部" ? "ALL" : POSTERS.filter(p => p.region === r).length + " 条行程") + '</small></a>'
).join("");
$("#burger").addEventListener("click", openMenu);
$("#menuClose").addEventListener("click", closeMenu);
document.querySelectorAll("#menuLinks a").forEach(a => a.addEventListener("click", e => {
  e.preventDefault();
  currentRegion = a.dataset.region;
  closeMenu(); renderFilters();
  if (location.hash !== "#/" && location.hash !== "") location.hash = "#/";
  else renderList();
  setTimeout(() => $(".filterbar").scrollIntoView({behavior:"smooth"}), 60);
}));

/* 灯箱：放大查看 */
const lightbox = $("#lightbox");
function openLightbox(p){
  $("#lbBody").innerHTML = p.img
    ? '<img src="' + p.img + '" alt="' + p.title + '海报原图">'
    : '<div class="poster ratio34"><div class="poster-ph" style="background:linear-gradient(160deg,#f2f1ee,#e4e2dd)">'
      + '<span class="ph-char">' + p.region + '</span><span class="ph-tag">示例海报</span></div></div>';
  lightbox.hidden = false; document.body.style.overflow = "hidden";
}
function closeLightbox(){ lightbox.hidden = true; document.body.style.overflow = ""; }
$("#lbClose").addEventListener("click", closeLightbox);
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeLightbox(); closeMenu(); } });

/* 入场淡入（只变透明度，不上滑） */
const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
}, {threshold: 0.08});
function observeReveals(){ document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el)); }

$("#emptyBack").addEventListener("click", () => {
  currentRegion = "全部"; renderFilters(); renderList();
});
window.addEventListener("hashchange", route);
renderFilters();
route();
</script>
</body>
</html>
